<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" fill="none">
  <!-- Barbell (bottom-left to top-right) -->
  <g stroke="#0A0A09" stroke-linecap="round" stroke-linejoin="round">
    <!-- Barbell bar -->
    <line x1="85" y1="210" x2="315" y2="70" stroke-width="3.5"/>
    <!-- Left weight plates -->
    <rect x="72" y="196" width="16" height="36" rx="2" fill="#0A0A09" transform="rotate(-30 80 214)"/>
    <rect x="58" y="190" width="10" height="28" rx="2" fill="#0A0A09" transform="rotate(-30 63 204)"/>
    <!-- Right weight plates -->
    <rect x="308" y="52" width="16" height="36" rx="2" fill="#0A0A09" transform="rotate(-30 316 70)"/>
    <rect x="322" y="46" width="10" height="28" rx="2" fill="#0A0A09" transform="rotate(-30 327 60)"/>
    <!-- Barbell grips -->
    <line x1="92" y1="206" x2="105" y2="197" stroke-width="6"/>
    <line x1="295" y1="82" x2="308" y2="73" stroke-width="6"/>
  </g>

  <!-- Fork (bottom-right to top-left) -->
  <g stroke="#0A0A09" stroke-linecap="round" stroke-linejoin="round">
    <!-- Fork handle -->
    <line x1="315" y1="210" x2="155" y2="85" stroke-width="3.5"/>
    <!-- Fork tines -->
    <line x1="155" y1="85" x2="130" y2="52" stroke-width="2.5"/>
    <line x1="155" y1="85" x2="142" y2="48" stroke-width="2.5"/>
    <line x1="155" y1="85" x2="155" y2="46" stroke-width="2.5"/>
    <line x1="155" y1="85" x2="168" y2="50" stroke-width="2.5"/>
  </g>

  <!-- Balance scale (centered above the X) -->
  <g stroke="#0A0A09" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Central pillar -->
    <line x1="200" y1="62" x2="200" y2="88" stroke-width="2.5"/>
    <!-- Top circle/ring -->
    <circle cx="200" cy="56" r="6" stroke-width="2"/>
    <!-- Beam -->
    <line x1="160" y1="68" x2="240" y2="68" stroke-width="2.5"/>
    <!-- Left chain -->
    <line x1="160" y1="68" x2="160" y2="85" stroke-width="1.5"/>
    <!-- Right chain -->
    <line x1="240" y1="68" x2="240" y2="85" stroke-width="1.5"/>
    <!-- Left pan -->
    <path d="M148 85 Q154 92 160 85 Q166 92 172 85" stroke-width="1.8"/>
    <!-- Right pan -->
    <path d="M228 85 Q234 92 240 85 Q246 92 252 85" stroke-width="1.8"/>
  </g>

  <!-- Text: SMARTFITCOACH -->
  <text x="200" y="268" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" letter-spacing="8" fill="#0A0A09">SMARTFITCOACH</text>
</svg>
