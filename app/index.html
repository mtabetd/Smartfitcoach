<title>Smart Fit Coach</title>
<style>
:root {
  /* ═══ TOKENS HERMÈS 2026-04 — DESIGN BIBLE v1 ═══
     Signée Direction Artistique. Prévaut sur toute décision locale. */
  /* Neutres — matière */
  --ink-900:#0A0A09; --ink-700:#2B2B27; --ink-500:#6B6B65; --ink-300:#A8A8A0;
  --line:#D8D8D0;
  --paper:#FAF9F6; --paper-2:#F4F1EA; --paper-3:#EEEAE0;
  /* Signature — ORANGE H exclusif (≤ 1,5 % surface) */
  --orange:#E86F1E; --orange-ink:#7A3B0E;
  /* Sémantique sobres */
  --success:#3E5C3A; --warning:#B07A2A; --error:#7A1F1F;
  /* Focus ring */
  --focus:#0A0A09;
  /* Spacing grille 8px */
  --sp-1:4px; --sp-2:8px; --sp-3:16px; --sp-4:24px; --sp-5:32px; --sp-6:48px; --sp-7:64px; --sp-8:96px;

  /* ── Alias LEGACY (conservés 1 release pour compat) ── */
  --ivory:#FAF9F6; --ivory2:#F4F1EA; --ivory3:#EEEAE0; --ivory4:#E5E4DE;
  --black:#0A0A09; --black2:#181818;
  --grey:#595953; --grey2:#6E6E68; --grey3:#6E6E66;
  --border:#D8D8D0;
  --green:#3E5C3A; --greenbg:rgba(62,92,58,.06);
  --blue:#1A3A6A; --bluebg:rgba(26,58,106,.06);
  --orangebg:rgba(232,111,30,.06);
  --red:#7A1F1F; --redbg:rgba(122,31,31,.06);
  --bg:#FAF9F6; --text:#0A0A09; --text-secondary:#6B6B65;
  --card:#F4F1EA; --surface:#F4F1EA; --accent:#0A0A09;
}

/* prefers-reduced-motion : accessibilité obligatoire (bible §11.5) */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

/* ── RESET & BASE ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;font-size:14px}
body{background:var(--ivory);color:var(--black);font-family:'Helvetica Neue',Arial,sans-serif;line-height:1.7;min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
/* Padding bottom étendu pour laisser place au coach-bar 64px + FAB 56px + marge 36px */
.app{max-width:680px;margin:0 auto;padding:0 24px max(200px,calc(200px + env(safe-area-inset-bottom)))}

/* ── HEADER ── */
.header{padding:40px 0 28px;border-bottom:1px solid var(--black);margin-bottom:40px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.logo{font-family:Georgia,serif;font-size:13px;letter-spacing:6px;text-transform:uppercase;font-weight:normal}
.logo span{display:block;font-size:9px;letter-spacing:3px;color:var(--grey);margin-top:4px;font-family:'Helvetica Neue',Arial,sans-serif;font-weight:300}
.step-indicator{font-family:'Helvetica Neue',Arial,sans-serif;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--grey)}

/* ── PROGRESS ── */
.progress-bar{height:1px;background:var(--border);margin-bottom:40px}
.progress-fill{height:1px;background:var(--black);width:0%;max-width:100%;transition:width .2s ease}

/* ── ANIMATIONS ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes splashFadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes splashLine{from{width:0}to{width:48px}}
.fade-in{animation:fadeUp .2s ease both}

/* ── TYPOGRAPHY ── */
.eyebrow{font-family:'Helvetica Neue',Arial,sans-serif;font-size:9px;letter-spacing:4px;text-transform:uppercase;color:var(--grey);margin-bottom:16px}
h1{font-family:Georgia,serif;font-size:clamp(28px,7vw,36px);font-weight:normal;line-height:1.1;letter-spacing:-1px;margin-bottom:16px}
h1 em{font-style:italic}
.subtitle{font-family:'Helvetica Neue',Arial,sans-serif;font-size:13px;color:var(--grey);line-height:1.8;margin-bottom:32px;font-weight:300}
.section-label{font-family:'Helvetica Neue',Arial,sans-serif;font-size:9px;letter-spacing:4px;text-transform:uppercase;color:var(--grey);margin-bottom:16px;margin-top:32px;padding-bottom:8px;border-bottom:1px solid var(--border)}

/* ── DIVIDERS ── */
.divider{display:flex;align-items:center;gap:12px;margin:24px 0 16px}
.divider-line{flex:1;height:1px;background:var(--border)}
.divider-text{font-family:'Helvetica Neue',Arial,sans-serif;font-size:9px;letter-spacing:4px;text-transform:uppercase;color:var(--grey);white-space:nowrap}

/* ── BUTTONS ── */
.btn-primary{display:block;width:100%;margin-top:8px;background:var(--black);color:var(--ivory);font-family:'Helvetica Neue',Arial,sans-serif;font-size:9px;letter-spacing:3px;text-transform:uppercase;font-weight:400;padding:18px 28px;border:1px solid var(--black);border-radius:2px;cursor:pointer;transition:all .25s cubic-bezier(0.25,0.46,0.45,0.94);outline:none}.btn-primary:focus-visible{outline:2px solid var(--focus,#0A0A09);outline-offset:2px}
.btn-primary:hover{background:var(--black2);transform:translateY(-2px);box-shadow:0 4px 16px rgba(10,10,9,0.12)}
.btn-primary:active{transform:translateY(0);box-shadow:none}
.btn-primary:disabled{background:var(--border);border-color:var(--border);color:var(--grey2);cursor:not-allowed;transform:none;box-shadow:none}
.btn-primary.loading{pointer-events:none;opacity:.7;position:relative;color:transparent}.btn-primary.loading::after{content:'';position:absolute;top:50%;left:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border:2px solid rgba(250,249,246,.3);border-top-color:var(--ivory,#FAF9F6);border-radius:50%;animation:_bspin .7s linear infinite}@keyframes _bspin{to{transform:rotate(360deg)}}
.btn-secondary{display:block;width:100%;margin-top:8px;background:transparent;color:var(--grey);font-family:'Helvetica Neue',Arial,sans-serif;font-size:9px;letter-spacing:4px;text-transform:uppercase;padding:12px 24px;min-height:44px;border:1px solid var(--border);border-radius:2px;cursor:pointer;transition:all .25s cubic-bezier(0.25,0.46,0.45,0.94);outline:none}.btn-secondary:focus-visible{outline:2px solid var(--focus,#0A0A09);outline-offset:2px}
.btn-secondary:hover{border-color:var(--black);color:var(--black);transform:translateY(-1px);box-shadow:0 2px 8px rgba(10,10,9,0.06)}
.btn-back{display:inline-flex;align-items:center;gap:8px;background:none;border:none;font-family:'Helvetica Neue',Arial,sans-serif;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--grey2);cursor:pointer;padding:10px 0;transition:color .2s}
.btn-back:hover{color:var(--black)}
.btn-back:hover svg{transform:translateX(-3px)}
.btn-back svg{transition:transform .2s}

/* ── FORM ── */
.field{margin-bottom:16px}
.field-label{font-family:'Helvetica Neue',Arial,sans-serif;font-size:9px;letter-spacing:6px;text-transform:uppercase;color:var(--grey);display:block;margin-bottom:8px}
.field input,.field textarea{width:100%;background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--black);font-family:'Helvetica Neue',Arial,sans-serif;font-size:16px;font-weight:300;padding:10px 0;outline:none;transition:border-color .2s ease}
.field input:focus,.field textarea:focus{border-bottom-color:var(--black);outline:none;box-shadow:0 1px 0 0 var(--black)}
.field input::placeholder,.field textarea::placeholder{color:var(--grey3)}

/* ── CARDS ── */
.card-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px}
.card-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:24px}
.card-grid-4{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px}
.sel-card{background:var(--ivory2);border:1px solid var(--border);border-radius:2px;padding:16px;cursor:pointer;transition:all .25s cubic-bezier(0.25,0.46,0.45,0.94);-webkit-user-select:none;user-select:none}
.sel-card:hover{border-color:var(--black2);box-shadow:0 2px 8px rgba(10,10,9,0.12);transform:translateY(-1px)}
.sel-card.on{background:var(--black);border-color:var(--black);color:var(--ivory)}
.sel-card.on .card-sub{color:rgba(255,255,255,.55)}
.sel-card.on .card-tag{color:rgba(255,255,255,.45)}
.card-icon{display:none}
.card-name{font-family:Georgia,serif;font-size:15px;margin-bottom:4px}
.card-sub{font-family:'Helvetica Neue',Arial,sans-serif;font-size:11px;color:var(--grey);line-height:1.4}
.card-tag{font-family:'Helvetica Neue',Arial,sans-serif;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--grey2);margin-top:4px;display:block}

/* ── LEVEL LIST ── */
.level-list{display:flex;flex-direction:column;gap:8px;margin-bottom:24px}
.level-item{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border:1px solid var(--border);border-radius:2px;cursor:pointer;transition:all .2s ease;background:var(--ivory2);-webkit-user-select:none;user-select:none}
.level-item:hover{border-color:var(--black2)}
.level-item.on{background:var(--black);border-color:var(--black);color:var(--ivory)}
.level-item.on .level-desc{color:rgba(255,255,255,.55)}
.level-item.on .level-badge{color:rgba(255,255,255,.45);border-color:rgba(255,255,255,.2)}
.level-name{font-family:Georgia,serif;font-size:15px}
.level-desc{font-family:'Helvetica Neue',Arial,sans-serif;font-size:11px;color:var(--grey);margin-top:2px}
.level-badge{font-family:'Helvetica Neue',Arial,sans-serif;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--grey2);padding:4px 8px;border:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

/* ── CHIPS ── */
.chip-wrap{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{font-family:'Helvetica Neue',Arial,sans-serif;font-size:11px;padding:10px 14px;min-height:44px;box-sizing:border-box;border:1px solid var(--border);border-radius:2px;cursor:pointer;background:var(--ivory2);transition:all .2s ease;-webkit-user-select:none;user-select:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.chip:hover{border-color:var(--black2)}
.chip.on{background:var(--black);border-color:var(--black);color:var(--ivory)}

/* ── CHECK ITEMS ── */
.check-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.check-item{display:flex;align-items:flex-start;gap:8px;padding:8px 12px;border:1px solid var(--border);border-radius:2px;cursor:pointer;transition:all .2s ease;background:var(--ivory2);-webkit-user-select:none;user-select:none}
.check-item:hover{border-color:var(--black2)}
.check-item.on{border-color:var(--green);background:var(--greenbg)}
.check-box{width:18px;height:18px;min-width:18px;border:1px solid var(--grey2);display:flex;align-items:center;justify-content:center;font-size:7px;color:transparent;margin-top:2px;transition:all .2s}
.check-item.on .check-box{background:var(--green);border-color:var(--green);color:var(--ivory)}
.check-label{font-family:'Helvetica Neue',Arial,sans-serif;font-size:11px;color:var(--black);line-height:1.3}
.check-sub{font-size:9px;color:var(--grey);margin-top:1px}

/* ── NUMBER INPUT ── */
.num-input-wrap{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.num-input{width:100%;background:var(--ivory);border:1px solid var(--border);border-radius:2px;color:var(--black);font-family:Georgia,serif;font-feature-settings:"onum" 1;font-size:24px;font-weight:300;padding:14px 16px;outline:none;transition:border-color .2s;text-align:center;-moz-appearance:textfield}
.num-input:focus{border-color:var(--black)}
.num-input::-webkit-outer-spin-button,.num-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.num-unit{font-family:'Helvetica Neue',Arial,sans-serif;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--grey);white-space:nowrap}
.num-hint{font-family:'Helvetica Neue',Arial,sans-serif;font-size:9px;color:var(--grey3);margin-top:2px}

/* ── RESULT ── */
.result-header{text-align:center;padding:40px 0 36px;border-bottom:1px solid var(--black);margin-bottom:32px}
.result-eyebrow{font-family:'Helvetica Neue',Arial,sans-serif;font-size:9px;letter-spacing:6px;text-transform:uppercase;color:var(--grey);margin-bottom:16px}
.result-title{font-family:Georgia,serif;font-size:24px;font-weight:normal;line-height:1;letter-spacing:-1px;margin-bottom:12px}
.result-title em{font-style:italic}
.result-rule{width:32px;height:1px;background:var(--black);margin:0 auto}

.stats-row{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--border);margin-bottom:24px}
.stat-cell{padding:14px 10px;text-align:center;border-right:1px solid var(--border);background:var(--ivory2)}
.stat-cell:last-child{border-right:none}
.stat-val{font-family:Georgia,serif;font-feature-settings:"onum" 1;font-size:24px;font-weight:300;margin-bottom:4px;transition:color .2s ease}
.stat-label{font-family:'Helvetica Neue',Arial,sans-serif;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--grey)}

/* ── MACRO DISPLAY ── */
.macro-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:24px}
.macro-cell{border:1px solid var(--border);border-radius:2px;padding:16px 8px;text-align:center;background:var(--ivory2)}
.macro-cell .m-val{font-family:Georgia,serif;font-feature-settings:"onum" 1;font-size:24px;font-weight:300;margin-bottom:2px}
.macro-cell .m-unit{font-family:'Helvetica Neue',Arial,sans-serif;font-size:11px;color:var(--grey)}
.macro-cell .m-label{font-family:'Helvetica Neue',Arial,sans-serif;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--grey);margin-top:4px}

.big-number{border:1px solid var(--border);border-radius:2px;padding:20px;text-align:center;background:var(--ivory2);margin-bottom:12px}
.big-number .bn-val{font-family:Georgia,serif;font-feature-settings:"onum" 1;font-size:24px;font-style:italic;font-weight:300}
.big-number .bn-label{font-family:'Helvetica Neue',Arial,sans-serif;font-size:9px;letter-spacing:4px;text-transform:uppercase;color:var(--grey);margin-top:8px}

/* ── MEAL BAR ── */
.meal-split{margin:12px 0 24px}
.meal-bar{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--ivory3)}
.meal-bar:last-child{border-bottom:none}
.meal-bar .bar-name{font-family:'Helvetica Neue',Arial,sans-serif;font-size:11px;width:80px;flex-shrink:0}
.meal-bar .bar-track{flex:1;height:3px;background:var(--ivory3)}
.meal-bar .bar-fill{height:3px;background:var(--black);transition:width .6s ease}
.meal-bar .bar-val{font-family:'Helvetica Neue',Arial,sans-serif;font-size:11px;color:var(--grey);width:80px;text-align:right;flex-shrink:0}

/* ── SVG RINGS ── */
.rings-row{display:flex;justify-content:center;gap:32px;flex-wrap:wrap;margin:24px 0}
.ring-wrap{text-align:center}
.ring-label{font-family:'Helvetica Neue',Arial,sans-serif;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--grey);margin-top:8px}
.ring-val{font-family:'Georgia',serif;font-size:14px;margin-top:2px}

/* ── PLANNING ── */
.day-tabs{display:flex;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:0}
.day-tabs::-webkit-scrollbar{display:none}
.day-tab{font-family:'Helvetica Neue',Arial,sans-serif;font-size:9px;letter-spacing:2px;text-transform:uppercase;padding:12px 14px;cursor:pointer;white-space:nowrap;border:none;background:none;color:var(--grey);border-bottom:2px solid transparent;transition:all .2s;flex-shrink:0}
.day-tab:hover{color:var(--black)}
.day-tab.active{color:var(--black);border-bottom-color:var(--black)}

.meal-card{background:var(--ivory2);border:1px solid var(--border);border-radius:2px;padding:16px;margin-bottom:16px;cursor:pointer;transition:all .2s ease;position:relative;overflow:hidden}
.meal-card:hover{border-color:var(--black2)}
.meal-type{font-family:'Helvetica Neue',Arial,sans-serif;font-size:9px;letter-spacing:4px;text-transform:uppercase;color:var(--grey);margin-bottom:6px}
.meal-name{font-family:Georgia,serif;font-size:16px;margin-bottom:2px;padding-right:32px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.35}
.meal-flag{margin-right:6px}
.meal-kcal{font-family:Georgia,serif;font-feature-settings:"onum" 1;font-size:24px;font-style:italic;font-weight:300;margin:6px 0}
.meal-macros{display:flex;gap:16px;flex-wrap:wrap;font-family:'Helvetica Neue',Arial,sans-serif;font-size:11px;color:var(--grey)}
.meal-macros .dot{width:4px;height:4px;display:inline-block;margin-right:4px;vertical-align:middle}
.meal-level{font-family:'Helvetica Neue',Arial,sans-serif;font-size:9px;color:var(--grey3);margin-top:8px}

.swap-btn{position:absolute;top:12px;right:12px;width:44px;height:44px;background:var(--ivory);border:1.5px solid var(--black);border-radius:2px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;transition:all .25s cubic-bezier(0.25,0.46,0.45,0.94);font-weight:600;color:var(--black)}
.swap-btn:hover{border-color:var(--black);background:var(--black);color:var(--ivory);box-shadow:0 4px 12px rgba(10,10,9,0.15);transform:scale(1.05)}
.swap-btn:active{transform:scale(0.95)}

.day-total{background:var(--ivory2);border:1px solid var(--border);border-left:2px solid var(--black);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.dt-label{font-family:'Helvetica Neue',Arial,sans-serif;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--grey)}
.dt-val{font-family:'Georgia',serif;font-size:18px}
.dt-diff{font-family:'Helvetica Neue',Arial,sans-serif;font-size:10px;margin-left:8px}

.whey-tip{border:1px solid var(--green);padding:12px 16px;margin-top:16px;background:var(--greenbg);border-radius:2px}
.whey-tip strong{font-family:'Helvetica Neue',Arial,sans-serif;font-size:9px;letter-spacing:3px;text-transform:uppercase;font-weight:300;color:var(--green)}
.whey-tip span{font-family:'Helvetica Neue',Arial,sans-serif;font-size:11px;color:var(--grey)}

.regen-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;border:1px solid var(--border);border-radius:2px;background:transparent;color:var(--grey);font-family:'Helvetica Neue',Arial,sans-serif;font-size:9px;letter-spacing:3px;text-transform:uppercase;cursor:pointer;transition:all .2s ease;margin-top:12px}
.regen-btn:hover{border-color:var(--black);color:var(--black)}

/* ── MODAL ── */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(10,10,9,0.5);z-index:1000;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.open{opacity:1;pointer-events:auto}
.modal-sheet{background:var(--ivory);max-width:680px;width:100%;max-height:85vh;overflow-y:auto;transform:translateY(100%);transition:transform .2s ease;border-radius:2px 2px 0 0}
.modal-overlay.open .modal-sheet{transform:translateY(0)}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:24px 24px 16px;position:sticky;top:0;background:var(--ivory);z-index:1;border-bottom:1px solid var(--border)}
.modal-title{font-family:Georgia,serif;font-size:18px}
.modal-close{width:44px;height:44px;background:var(--ivory2);border:1px solid var(--border);border-radius:2px;color:var(--black);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s ease}
.modal-body{padding:20px 24px 32px}
.macro-pills{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:24px}
.macro-pill{border:1px solid var(--border);border-radius:2px;padding:12px 8px;text-align:center;background:var(--ivory2)}
.macro-pill .mp-val{font-family:Georgia,serif;font-feature-settings:"onum" 1;font-size:18px;font-weight:300}
.macro-pill .mp-label{font-family:'Helvetica Neue',Arial,sans-serif;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--grey);margin-top:2px}
.ingredient-list{list-style:none;margin-bottom:24px}
.ingredient-list li{padding:4px 0;font-family:'Helvetica Neue',Arial,sans-serif;font-size:13px;color:var(--grey);border-bottom:1px solid var(--ivory3);display:flex;align-items:center;gap:8px}
.ingredient-list li::before{content:'·';color:var(--black);font-weight:800;font-size:16px}
.step-list{list-style:none;counter-reset:steps;margin-bottom:20px}
.step-list li{padding:8px 0;font-family:'Helvetica Neue',Arial,sans-serif;font-size:13px;color:var(--grey);display:flex;gap:10px;line-height:1.6}
.step-list li::before{counter-increment:steps;content:counter(steps);width:22px;height:22px;background:var(--ivory2);border:1px solid var(--border);color:var(--black);font-family:'Georgia',serif;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.macro-check{font-family:'Helvetica Neue',Arial,sans-serif;font-size:11px;color:var(--grey3);text-align:center;padding:10px;border-top:1px solid var(--border);margin-top:12px}

/* ── IMC BADGE ── */
.imc-badge{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border:2px solid;font-family:Georgia,serif;font-size:15px;letter-spacing:1px;margin-top:12px;border-radius:2px;font-weight:normal;transition:all .2s ease}

/* ── SPLASH ── */
#splash{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--ivory);z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center;animation:splashExit .5s ease 1.5s forwards}
@keyframes splashExit{to{opacity:0;visibility:hidden}}
#splash.hidden{opacity:0;visibility:hidden;pointer-events:none}
.splash-logo{font-family:Georgia,serif;font-size:11px;letter-spacing:8px;text-transform:uppercase;color:var(--black);opacity:0;animation:splashFadeUp .8s ease .2s forwards;margin-bottom:6px}
.splash-sub{font-family:'Helvetica Neue',Arial,sans-serif;font-size:9px;letter-spacing:4px;text-transform:uppercase;color:var(--grey);opacity:0;animation:splashFadeUp .8s ease .5s forwards;margin-bottom:32px}
.splash-line{width:0;height:1px;background:var(--black);margin:0 auto 28px;animation:splashLine .7s ease .3s forwards}
.splash-quote{font-family:Georgia,serif;font-size:16px;font-style:italic;color:var(--black);line-height:1.7;max-width:320px;opacity:0;animation:splashFadeUp .8s ease .7s forwards;margin-bottom:36px}
.splash-btn{display:block;width:100%;max-width:320px;margin-top:0;background:var(--black);color:var(--ivory);font-family:'Helvetica Neue',Arial,sans-serif;font-size:9px;letter-spacing:6px;text-transform:uppercase;padding:18px;border:none;cursor:pointer;opacity:0;animation:splashFadeUp .8s ease 1.1s forwards}
.splash-btn:hover{background:var(--black2)}

/* ── FOOTER ── */
.footer{text-align:center;padding:32px 0 0;border-top:1px solid var(--border);margin-top:40px}
.footer a{font-family:'Helvetica Neue',Arial,sans-serif;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--grey3);text-decoration:none;transition:color .2s}
.footer a:hover{color:var(--black)}

/* ══════════════════════════════════════
   NEW MODULES — Auth, Nav, Charts, Photo,
   Alcohol, Sport, Validation
   ══════════════════════════════════════ */

/* ── AUTH SCREENS ── */
.auth-container{max-width:420px;margin:0 auto;padding:60px 32px}
.auth-logo{font-family:Georgia,serif;font-size:11px;letter-spacing:8px;text-transform:uppercase;font-weight:300;text-align:center;margin-bottom:48px}
.auth-title{font-family:Georgia,serif;font-size:24px;font-weight:300;font-style:italic;margin-bottom:32px;text-align:center}
.auth-sub{font-family:'Helvetica Neue',Arial,sans-serif;font-size:9px;letter-spacing:4px;text-transform:uppercase;color:var(--grey);text-align:center;margin-bottom:32px}
.auth-line{width:48px;height:1px;background:var(--black);margin:0 auto 28px}
.auth-form{margin-bottom:24px}
.auth-error{font-family:'Helvetica Neue',Arial,sans-serif;font-size:11px;color:var(--red);text-align:center;padding:8px;border:1px solid var(--red);background:var(--redbg);margin-bottom:12px}
.auth-switch{font-family:'Helvetica Neue',Arial,sans-serif;font-size:11px;color:var(--grey);text-align:center}
.auth-switch a{color:var(--black);cursor:pointer;text-decoration:underline}

/* ── NAVIGATION TABS (Nutrition | Sport) ── */
.main-nav{display:flex;border-bottom:1px solid var(--black);margin-bottom:0;border-top:1px solid var(--border);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);background:rgba(250,250,247,.92)}
.main-nav-tab{flex:1;text-align:center;font-family:'Helvetica Neue',Arial,sans-serif;font-size:9px;letter-spacing:2px;text-transform:uppercase;padding:14px 6px;cursor:pointer;background:none;border:none;border-bottom:2px solid transparent;color:var(--grey);transition:all .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.main-nav-tab:hover{color:var(--black)}
.main-nav-tab.active{color:var(--black);border-bottom-color:var(--black)}
.user-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);margin-bottom:16px}
.user-name{font-family:'Helvetica Neue',Arial,sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--grey)}
.user-logout{font-family:'Helvetica Neue',Arial,sans-serif;font-size:9px;color:var(--grey3);cursor:pointer;background:none;border:none;text-decoration:underline}

/* ── CHARTS / CANVAS ── */
.chart-container{border:1px solid var(--border);border-radius:2px;background:var(--ivory2);padding:16px;margin:16px 0}
.chart-title{font-family:'Helvetica Neue',Arial,sans-serif;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--grey);margin-bottom:12px}
canvas.weight-chart{width:100%;height:200px}

/* ── PHOTO UPLOAD ── */
.photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.photo-upload{border:1px solid var(--border);border-radius:2px;padding:24px;text-align:center;cursor:pointer;transition:border-color .2s ease;min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--ivory2)}
.photo-upload:hover{border-color:var(--black)}
.photo-upload img{max-width:100%;max-height:160px;object-fit:contain}
.photo-upload .photo-label{font-family:'Helvetica Neue',Arial,sans-serif;font-size:9px;letter-spacing:4px;text-transform:uppercase;color:var(--grey3);margin-top:12px}
.photo-icon-svg{color:var(--grey3);display:block;margin-bottom:4px}

/* ── ALCOHOL SECTION ── */
.alcohol-item{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border:1px solid var(--border);border-radius:2px;background:var(--ivory2);margin-bottom:4px}
.alcohol-name{font-family:'Helvetica Neue',Arial,sans-serif;font-size:13px}
.alcohol-kcal{font-family:'Georgia',serif;font-size:14px;font-style:italic;color:var(--orange)}
.alcohol-freq{display:flex;gap:8px;align-items:center}

/* ── SPORT MODULE ── */
.exercise-card{background:var(--ivory2);border:1px solid var(--border);border-radius:2px;padding:16px;margin-bottom:16px;overflow:hidden;transition:all .2s ease}
.exercise-card:hover{border-color:var(--black2)}
.exercise-name{font-family:Georgia,serif;font-size:16px;margin-bottom:4px}
.exercise-muscle{font-family:'Helvetica Neue',Arial,sans-serif;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--grey)}
.exercise-detail{font-family:'Helvetica Neue',Arial,sans-serif;font-size:11px;color:var(--grey);margin-top:8px}
.exercise-video{display:inline-flex;align-items:center;gap:8px;font-family:'Helvetica Neue',Arial,sans-serif;font-size:11px;color:var(--blue);margin-top:8px;text-decoration:none;border:1px solid var(--blue);padding:4px 10px;transition:all .2s}
.exercise-video:hover{background:var(--bluebg)}
.exercise-sets{font-family:'Helvetica Neue',Arial,sans-serif;font-size:11px;color:var(--black);margin-top:6px}
.body-silhouette{text-align:center;padding:20px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.muscle-tag{display:inline-block;padding:12px 16px;min-height:44px;box-sizing:border-box;margin:4px;font-family:'Helvetica Neue',Arial,sans-serif;font-size:11px;border:1px solid var(--border);cursor:pointer;transition:all .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.muscle-tag.strong{background:var(--greenbg);border-color:var(--green);color:var(--green)}
.muscle-tag.weak{background:var(--redbg);border-color:var(--red);color:var(--red)}

/* ── STEP / PAGE TITLES ── */
.step-title{font-family:Georgia,serif;font-size:24px;font-weight:normal;line-height:1.2;letter-spacing:0.3px;margin-bottom:20px;margin-top:32px}
.page-title{font-family:Georgia,serif;font-size:24px;font-weight:normal;line-height:1.2;letter-spacing:-0.3px;margin-bottom:20px;margin-top:32px}

/* ── TAGS ── */
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}

/* ── VALIDATION ── */
.field-error{font-family:'Helvetica Neue',Arial,sans-serif;font-size:9px;color:var(--red);margin-top:4px}
.field.has-error input{border-color:var(--red)}
.required-dot{color:var(--red);font-size:9px;margin-left:2px}

/* ── RESPONSIVE ── */
@media(max-width:560px){
  h1{font-size:24px}
  .result-title{font-size:24px}
  .card-grid-3,.card-grid-4{grid-template-columns:1fr 1fr}
  .check-grid{grid-template-columns:1fr}
  .stats-row{grid-template-columns:1fr 1fr}
  .macro-pills{grid-template-columns:1fr 1fr}
  .rings-row{gap:20px}
  .photo-grid{grid-template-columns:1fr}
  .auth-container{padding:40px 16px}
  .main-nav-tab{font-size:9px;letter-spacing:1px;padding:12px 4px}
  .exercise-card{padding:12px}
}
@media(max-width:380px){
  .app{padding:0 20px 60px}
  .card-grid-2{grid-template-columns:1fr 1fr}
  .alcohol-item{flex-direction:column;align-items:flex-start;gap:6px}
  .user-bar{flex-direction:column;align-items:flex-start;gap:6px}
}
</style>
