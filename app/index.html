<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FAFAF7">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://world.openfoodfacts.org https://images.openfoodfacts.org https:; connect-src 'self' https://world.openfoodfacts.org; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="X-Frame-Options" content="DENY">
<meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./premium-ui.css">
<title>MTD Macro Calculator</title>
<style>
:root {
  --ivory:#FAFAF7; --ivory2:#F4F4F0; --ivory3:#EEEDE8; --ivory4:#E5E4DE;
  --black:#0A0A09; --black2:#1A1A18;
  --grey:#5A5A54; --grey2:#9A9A94; --grey3:#C8C8C0;
  --border:#D8D8D0;
  --green:#1A4A1A; --greenbg:rgba(26,74,26,.06);
  --blue:#1A3A6A; --bluebg:rgba(26,58,106,.06);
  --orange:#6A4A1A; --orangebg:rgba(106,74,26,.06);
  --red:#5A1010; --redbg:rgba(90,16,16,.06);
  /* Semantic aliases used by newer components (shopping list, salad bar, budget, set-tracker) */
  --bg:#FAFAF7; --text:#0A0A09; --text-secondary:#5A5A54;
  --card:#F4F4F0; --surface:#F4F4F0; --accent:#1A4A1A;
}

/* ── RESET & BASE ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;font-size:14px}
body{background:var(--ivory);color:var(--black);font-family:'Montserrat','Helvetica Neue',sans-serif;line-height:1.7;min-height:100vh;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
.app{max-width:680px;margin:0 auto;padding:0 24px 80px;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* ── HEADER ── */
.header{padding:40px 0 28px;border-bottom:1px solid var(--black);margin-bottom:40px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.logo{font-family:'Cormorant Garamond',Georgia,serif;font-size:13px;letter-spacing:6px;text-transform:uppercase;font-weight:normal}
.logo span{display:block;font-size:9px;letter-spacing:3px;color:var(--grey);margin-top:3px;font-family:'Montserrat','Helvetica Neue',sans-serif;font-weight:300}
.step-indicator{font-family:'Montserrat','Helvetica Neue',sans-serif;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--grey)}

/* ── PROGRESS ── */
.progress-bar{height:1px;background:var(--border);margin-bottom:40px}
.progress-fill{height:1px;background:var(--black);width:0%;transition:width .6s cubic-bezier(.4,0,.2,1)}

/* ── ANIMATIONS ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes splashFadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes splashLine{from{width:0}to{width:48px}}
.fade-in{animation:fadeUp .35s ease both}

/* ── TYPOGRAPHY ── */
.eyebrow{font-family:'Montserrat','Helvetica Neue',sans-serif;font-size:9px;letter-spacing:6px;text-transform:uppercase;color:var(--grey);margin-bottom:16px}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:42px;font-weight:normal;line-height:1;letter-spacing:-1px;margin-bottom:16px}
h1 em{font-style:italic}
.subtitle{font-family:'Montserrat','Helvetica Neue',sans-serif;font-size:12px;color:var(--grey);line-height:1.8;margin-bottom:36px;font-weight:300}
.section-label{font-family:'Montserrat','Helvetica Neue',sans-serif;font-size:9px;letter-spacing:6px;text-transform:uppercase;color:var(--grey);margin-bottom:20px;margin-top:32px;padding-bottom:8px;border-bottom:1px solid var(--border)}

/* ── DIVIDERS ── */
.divider{display:flex;align-items:center;gap:12px;margin:24px 0 14px}
.divider-line{flex:1;height:1px;background:var(--border)}
.divider-text{font-family:'Helvetica Neue',Arial,sans-serif;font-size:9px;letter-spacing:4px;text-transform:uppercase;color:var(--grey);white-space:nowrap}

/* ── BUTTONS ── */
.btn-primary{display:block;width:100%;margin-top:8px;background:var(--black);color:var(--ivory);font-family:'Montserrat','Helvetica Neue',sans-serif;font-size:8px;letter-spacing:6px;text-transform:uppercase;font-weight:400;padding:18px 28px;border:1px solid var(--black);cursor:pointer;transition:all .35s cubic-bezier(.25,.46,.45,.94);outline:none}
.btn-primary:hover{background:var(--black2)}
.btn-primary:disabled{background:var(--border);border-color:var(--border);color:var(--grey2);cursor:not-allowed}
.btn-secondary{display:block;width:100%;margin-top:8px;background:transparent;color:var(--grey);font-family:'Montserrat','Helvetica Neue',sans-serif;font-size:9px;letter-spacing:4px;text-transform:uppercase;padding:12px 24px;border:1px solid var(--border);cursor:pointer;transition:all .2s;outline:none}
.btn-secondary:hover{border-color:var(--black);color:var(--black)}
.btn-back{display:inline-flex;align-items:center;gap:8px;background:none;border:none;font-family:'Montserrat','Helvetica Neue',sans-serif;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--grey2);cursor:pointer;padding:10px 0;transition:color .2s}
.btn-back:hover{color:var(--black)}
.btn-back:hover svg{transform:translateX(-3px)}
.btn-back svg{transition:transform .2s}

/* ── FORM ── */
.field{margin-bottom:18px}
.field-label{font-family:'Montserrat','Helvetica Neue',sans-serif;font-size:9px;letter-spacing:6px;text-transform:uppercase;color:var(--grey);display:block;margin-bottom:7px}
.field input,.field textarea{width:100%;background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--black);font-family:'Montserrat','Helvetica Neue',sans-serif;font-size:13px;font-weight:300;padding:10px 0;outline:none;transition:border-color .3s ease}
.field input:focus,.field textarea:focus{border-bottom-color:var(--black);outline:none}
.field input::placeholder,.field textarea::placeholder{color:var(--grey3)}

/* ── CARDS ── */
.card-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px}
.card-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:24px}
.card-grid-4{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px}
.sel-card{background:var(--ivory2);border:1px solid var(--border);padding:18px 14px;cursor:pointer;transition:all .2s;-webkit-user-select:none;user-select:none}
.sel-card:hover{border-color:var(--black2)}
.sel-card.on{background:var(--black);border-color:var(--black);color:var(--ivory)}
.sel-card.on .card-sub{color:rgba(255,255,255,.55)}
.sel-card.on .card-tag{color:rgba(255,255,255,.45)}
.card-icon{font-size:18px;margin-bottom:8px;display:block;font-style:normal}
.card-name{font-family:'Cormorant Garamond',Georgia,serif;font-size:15px;margin-bottom:3px}
.card-sub{font-family:'Montserrat','Helvetica Neue',sans-serif;font-size:10px;color:var(--grey);line-height:1.4}
.card-tag{font-family:'Montserrat','Helvetica Neue',sans-serif;font-size:8px;letter-spacing:3px;text-transform:uppercase;color:var(--grey2);margin-top:4px;display:block}

/* ── LEVEL LIST ── */
.level-list{display:flex;flex-direction:column;gap:6px;margin-bottom:24px}
.level-item{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border:1px solid var(--border);cursor:pointer;transition:all .2s;background:var(--ivory2);-webkit-user-select:none;user-select:none}
.level-item:hover{border-color:var(--black2)}
.level-item.on{background:var(--black);border-color:var(--black);color:var(--ivory)}
.level-item.on .level-desc{color:rgba(255,255,255,.55)}
.level-item.on .level-badge{color:rgba(255,255,255,.45);border-color:rgba(255,255,255,.2)}
.level-name{font-family:'Cormorant Garamond',Georgia,serif;font-size:15px}
.level-desc{font-family:'Montserrat','Helvetica Neue',sans-serif;font-size:10px;color:var(--grey);margin-top:2px}
.level-badge{font-family:'Montserrat','Helvetica Neue',sans-serif;font-size:8px;letter-spacing:3px;text-transform:uppercase;color:var(--grey2);padding:3px 9px;border:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

/* ── CHIPS ── */
.chip-wrap{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{font-family:'Montserrat','Helvetica Neue',sans-serif;font-size:10px;padding:4px 10px;border:1px solid var(--border);cursor:pointer;background:var(--ivory2);transition:all .2s cubic-bezier(.25,.46,.45,.94);-webkit-user-select:none;user-select:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.chip:hover{border-color:var(--black2)}
.chip.on{background:var(--black);border-color:var(--black);color:var(--ivory)}

/* ── CHECK ITEMS ── */
.check-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:18px}
.check-item{display:flex;align-items:flex-start;gap:9px;padding:9px 12px;border:1px solid var(--border);cursor:pointer;transition:all .2s;background:var(--ivory2);-webkit-user-select:none;user-select:none}
.check-item:hover{border-color:var(--black2)}
.check-item.on{border-color:var(--green);background:var(--greenbg)}
.check-box{width:11px;height:11px;min-width:11px;border:1px solid var(--grey2);display:flex;align-items:center;justify-content:center;font-size:7px;color:transparent;margin-top:2px;transition:all .2s}
.check-item.on .check-box{background:var(--green);border-color:var(--green);color:var(--ivory)}
.check-label{font-family:'Helvetica Neue',Arial,sans-serif;font-size:10px;color:var(--black);line-height:1.3}
.check-sub{font-size:9px;color:var(--grey);margin-top:1px}

/* ── NUMBER INPUT ── */
.num-input-wrap{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.num-input{width:100%;background:var(--ivory);border:1px solid var(--border);color:var(--black);font-family:'Cormorant Garamond',Georgia,serif;font-feature-settings:"onum" 1;font-size:28px;font-weight:300;padding:14px 16px;outline:none;transition:border-color .2s;text-align:center;-moz-appearance:textfield}
.num-input:focus{border-color:var(--black)}
.num-input::-webkit-outer-spin-button,.num-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.num-unit{font-family:'Montserrat','Helvetica Neue',sans-serif;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--grey);white-space:nowrap}
.num-hint{font-family:'Montserrat','Helvetica Neue',sans-serif;font-size:9px;color:var(--grey3);margin-top:2px}

/* ── RESULT ── */
.result-header{text-align:center;padding:40px 0 36px;border-bottom:1px solid var(--black);margin-bottom:32px}
.result-eyebrow{font-family:'Montserrat','Helvetica Neue',sans-serif;font-size:9px;letter-spacing:6px;text-transform:uppercase;color:var(--grey);margin-bottom:16px}
.result-title{font-family:'Cormorant Garamond',Georgia,serif;font-size:48px;font-weight:normal;line-height:1;letter-spacing:-1px;margin-bottom:12px}
.result-title em{font-style:italic}
.result-rule{width:32px;height:1px;background:var(--black);margin:0 auto}

.stats-row{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--border);margin-bottom:24px}
.stat-cell{padding:14px 10px;text-align:center;border-right:1px solid var(--border);background:var(--ivory2)}
.stat-cell:last-child{border-right:none}
.stat-val{font-family:'Cormorant Garamond',Georgia,serif;font-feature-settings:"onum" 1;font-size:24px;font-weight:300;margin-bottom:4px;transition:color 0.3s ease}
.stat-label{font-family:'Montserrat','Helvetica Neue',sans-serif;font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--grey)}

/* ── MACRO DISPLAY ── */
.macro-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:24px}
.macro-cell{border:1px solid var(--border);padding:16px 8px;text-align:center;background:var(--ivory2)}
.macro-cell .m-val{font-family:'Cormorant Garamond',Georgia,serif;font-feature-settings:"onum" 1;font-size:28px;font-weight:300;margin-bottom:2px}
.macro-cell .m-unit{font-family:'Montserrat','Helvetica Neue',sans-serif;font-size:10px;color:var(--grey)}
.macro-cell .m-label{font-family:'Montserrat','Helvetica Neue',sans-serif;font-size:8px;letter-spacing:3px;text-transform:uppercase;color:var(--grey);margin-top:4px}

.big-number{border:1px solid var(--border);padding:20px;text-align:center;background:var(--ivory2);margin-bottom:12px}
.big-number .bn-val{font-family:'Cormorant Garamond',Georgia,serif;font-feature-settings:"onum" 1;font-size:48px;font-style:italic;font-weight:300}
.big-number .bn-label{font-family:'Montserrat','Helvetica Neue',sans-serif;font-size:9px;letter-spacing:4px;text-transform:uppercase;color:var(--grey);margin-top:6px}

/* ── MEAL BAR ── */
.meal-split{margin:12px 0 24px}
.meal-bar{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--ivory3)}
.meal-bar:last-child{border-bottom:none}
.meal-bar .bar-name{font-family:'Helvetica Neue',Arial,sans-serif;font-size:11px;width:80px;flex-shrink:0}
.meal-bar .bar-track{flex:1;height:3px;background:var(--ivory3)}
.meal-bar .bar-fill{height:3px;background:var(--black);transition:width .6s ease}
.meal-bar .bar-val{font-family:'Helvetica Neue',Arial,sans-serif;font-size:10px;color:var(--grey);width:80px;text-align:right;flex-shrink:0}

/* ── SVG RINGS ── */
.rings-row{display:flex;justify-content:center;gap:32px;flex-wrap:wrap;margin:24px 0}
.ring-wrap{text-align:center}
.ring-label{font-family:'Helvetica Neue',Arial,sans-serif;font-size:8px;letter-spacing:3px;text-transform:uppercase;color:var(--grey);margin-top:8px}
.ring-val{font-family:'Georgia',serif;font-size:14px;margin-top:2px}

/* ── PLANNING ── */
.day-tabs{display:flex;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:0}
.day-tabs::-webkit-scrollbar{display:none}
.day-tab{font-family:'Helvetica Neue',Arial,sans-serif;font-size:9px;letter-spacing:2px;text-transform:uppercase;padding:12px 14px;cursor:pointer;white-space:nowrap;border:none;background:none;color:var(--grey);border-bottom:2px solid transparent;transition:all .2s;flex-shrink:0}
.day-tab:hover{color:var(--black)}
.day-tab.active{color:var(--black);border-bottom-color:var(--black)}

.meal-card{background:var(--ivory2);border:1px solid var(--border);padding:16px;margin-bottom:16px;cursor:pointer;transition:all .15s;position:relative;overflow:hidden}
.meal-card:hover{border-color:var(--black2)}
.meal-type{font-family:'Montserrat','Helvetica Neue',sans-serif;font-size:8px;letter-spacing:4px;text-transform:uppercase;color:var(--grey);margin-bottom:6px}
.meal-name{font-family:'Cormorant Garamond',Georgia,serif;font-size:16px;margin-bottom:2px;padding-right:32px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.35}
.meal-flag{margin-right:6px}
.meal-kcal{font-family:'Cormorant Garamond',Georgia,serif;font-feature-settings:"onum" 1;font-size:22px;font-style:italic;font-weight:300;margin:6px 0}
.meal-macros{display:flex;gap:16px;flex-wrap:wrap;font-family:'Montserrat','Helvetica Neue',sans-serif;font-size:10px;color:var(--grey)}
.meal-macros .dot{width:5px;height:5px;display:inline-block;margin-right:3px;vertical-align:middle}
.meal-level{font-family:'Helvetica Neue',Arial,sans-serif;font-size:9px;color:var(--grey3);margin-top:6px}

.swap-btn{position:absolute;top:14px;right:14px;width:28px;height:28px;background:var(--ivory);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;transition:all .15s}
.swap-btn:hover{border-color:var(--black);background:var(--ivory3)}

.day-total{background:var(--ivory2);border:1px solid var(--border);border-left:2px solid var(--black);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.dt-label{font-family:'Helvetica Neue',Arial,sans-serif;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--grey)}
.dt-val{font-family:'Georgia',serif;font-size:18px}
.dt-diff{font-family:'Helvetica Neue',Arial,sans-serif;font-size:10px;margin-left:8px}

.whey-tip{border-left:2px solid var(--green);padding:12px 16px;margin-top:16px;background:var(--greenbg)}
.whey-tip strong{font-family:'Helvetica Neue',Arial,sans-serif;font-size:10px;font-weight:600}
.whey-tip span{font-family:'Helvetica Neue',Arial,sans-serif;font-size:10px;color:var(--grey)}

.regen-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:12px;border:1px solid var(--border);background:transparent;color:var(--grey);font-family:'Helvetica Neue',Arial,sans-serif;font-size:9px;letter-spacing:3px;text-transform:uppercase;cursor:pointer;transition:all .15s;margin-top:12px}
.regen-btn:hover{border-color:var(--black);color:var(--black)}

/* ── MODAL ── */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(10,10,9,0.5);z-index:1000;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.open{opacity:1;pointer-events:auto}
.modal-sheet{background:var(--ivory);max-width:680px;width:100%;max-height:85vh;overflow-y:auto;transform:translateY(100%);transition:transform .3s ease}
.modal-overlay.open .modal-sheet{transform:translateY(0)}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:24px 24px 16px;position:sticky;top:0;background:var(--ivory);z-index:1;border-bottom:1px solid var(--border)}
.modal-title{font-family:'Cormorant Garamond',Georgia,serif;font-size:18px}
.modal-close{width:28px;height:28px;background:var(--ivory2);border:1px solid var(--border);color:var(--black);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.modal-body{padding:20px 24px 32px}
.macro-pills{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:24px}
.macro-pill{border:1px solid var(--border);padding:10px 6px;text-align:center;background:var(--ivory2)}
.macro-pill .mp-val{font-family:'Cormorant Garamond',Georgia,serif;font-feature-settings:"onum" 1;font-size:17px;font-weight:300}
.macro-pill .mp-label{font-family:'Montserrat','Helvetica Neue',sans-serif;font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--grey);margin-top:2px}
.ingredient-list{list-style:none;margin-bottom:24px}
.ingredient-list li{padding:5px 0;font-family:'Helvetica Neue',Arial,sans-serif;font-size:12px;color:var(--grey);border-bottom:1px solid var(--ivory3);display:flex;align-items:center;gap:8px}
.ingredient-list li::before{content:'·';color:var(--black);font-weight:800;font-size:16px}
.step-list{list-style:none;counter-reset:steps;margin-bottom:20px}
.step-list li{padding:8px 0;font-family:'Helvetica Neue',Arial,sans-serif;font-size:12px;color:var(--grey);display:flex;gap:10px;line-height:1.6}
.step-list li::before{counter-increment:steps;content:counter(steps);width:22px;height:22px;background:var(--ivory2);border:1px solid var(--border);color:var(--black);font-family:'Georgia',serif;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.macro-check{font-family:'Helvetica Neue',Arial,sans-serif;font-size:10px;color:var(--grey3);text-align:center;padding:10px;border-top:1px solid var(--border);margin-top:12px}

/* ── IMC BADGE ── */
.imc-badge{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border:2px solid;font-family:'Georgia',serif;font-size:15px;letter-spacing:1px;margin-top:10px;border-radius:2px;font-weight:normal;transition:all 0.3s ease}

/* ── SPLASH ── */
#splash{position:fixed;inset:0;background:var(--ivory);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center;transition:opacity .6s ease,visibility .6s ease}
#splash.hidden{opacity:0;visibility:hidden;pointer-events:none}
.splash-logo{font-family:'Cormorant Garamond',Georgia,serif;font-size:11px;letter-spacing:8px;text-transform:uppercase;color:var(--black);opacity:0;animation:splashFadeUp .8s ease .2s forwards;margin-bottom:6px}
.splash-sub{font-family:'Montserrat','Helvetica Neue',sans-serif;font-size:8px;letter-spacing:4px;text-transform:uppercase;color:var(--grey);opacity:0;animation:splashFadeUp .8s ease .5s forwards;margin-bottom:32px}
.splash-line{width:0;height:1px;background:var(--black);margin:0 auto 28px;animation:splashLine .7s ease .3s forwards}
.splash-quote{font-family:'Cormorant Garamond',Georgia,serif;font-size:16px;font-style:italic;color:var(--black);line-height:1.7;max-width:320px;opacity:0;animation:splashFadeUp .8s ease .7s forwards;margin-bottom:36px}
.splash-btn{display:block;width:100%;max-width:320px;margin-top:0;background:var(--black);color:var(--ivory);font-family:'Montserrat','Helvetica Neue',sans-serif;font-size:8px;letter-spacing:6px;text-transform:uppercase;padding:18px;border:none;cursor:pointer;opacity:0;animation:splashFadeUp .8s ease 1.1s forwards}
.splash-btn:hover{background:var(--black2)}

/* ── FOOTER ── */
.footer{text-align:center;padding:32px 0 0;border-top:1px solid var(--border);margin-top:40px}
.footer a{font-family:'Helvetica Neue',Arial,sans-serif;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--grey3);text-decoration:none;transition:color .2s}
.footer a:hover{color:var(--black)}

/* ══════════════════════════════════════
   NEW MODULES — Auth, Nav, Charts, Photo,
   Alcohol, Sport, Validation
   ══════════════════════════════════════ */

/* ── AUTH SCREENS ── */
.auth-container{max-width:420px;margin:0 auto;padding:60px 32px}
.auth-logo{font-family:'Cormorant Garamond',Georgia,serif;font-size:11px;letter-spacing:8px;text-transform:uppercase;font-weight:300;text-align:center;margin-bottom:48px}
.auth-title{font-family:'Cormorant Garamond',Georgia,serif;font-size:32px;font-weight:300;font-style:italic;margin-bottom:32px;text-align:center}
.auth-sub{font-family:'Montserrat','Helvetica Neue',sans-serif;font-size:8px;letter-spacing:4px;text-transform:uppercase;color:var(--grey);text-align:center;margin-bottom:32px}
.auth-line{width:48px;height:1px;background:var(--black);margin:0 auto 28px}
.auth-form{margin-bottom:24px}
.auth-error{font-family:'Helvetica Neue',Arial,sans-serif;font-size:10px;color:var(--red);text-align:center;padding:8px;border:1px solid var(--red);background:var(--redbg);margin-bottom:12px}
.auth-switch{font-family:'Helvetica Neue',Arial,sans-serif;font-size:11px;color:var(--grey);text-align:center}
.auth-switch a{color:var(--black);cursor:pointer;text-decoration:underline}

/* ── NAVIGATION TABS (Nutrition | Sport) ── */
.main-nav{display:flex;border-bottom:1px solid var(--black);margin-bottom:0;border-top:1px solid var(--border);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);background:rgba(250,250,247,.92)}
.main-nav-tab{flex:1;text-align:center;font-family:'Montserrat','Helvetica Neue',sans-serif;font-size:8px;letter-spacing:2px;text-transform:uppercase;padding:16px;cursor:pointer;background:none;border:none;border-bottom:2px solid transparent;color:var(--grey);transition:all .2s}
.main-nav-tab:hover{color:var(--black)}
.main-nav-tab.active{color:var(--black);border-bottom-color:var(--black)}
.user-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);margin-bottom:16px}
.user-name{font-family:'Helvetica Neue',Arial,sans-serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--grey)}
.user-logout{font-family:'Helvetica Neue',Arial,sans-serif;font-size:9px;color:var(--grey3);cursor:pointer;background:none;border:none;text-decoration:underline}

/* ── CHARTS / CANVAS ── */
.chart-container{border:1px solid var(--border);background:var(--ivory2);padding:16px;margin:16px 0}
.chart-title{font-family:'Helvetica Neue',Arial,sans-serif;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--grey);margin-bottom:12px}
canvas.weight-chart{width:100%;height:200px}

/* ── PHOTO UPLOAD ── */
.photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.photo-upload{border:2px dashed var(--border);padding:24px;text-align:center;cursor:pointer;transition:all .2s;min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--ivory2)}
.photo-upload:hover{border-color:var(--black)}
.photo-upload img{max-width:100%;max-height:160px;object-fit:contain}
.photo-upload .photo-label{font-family:'Helvetica Neue',Arial,sans-serif;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--grey);margin-top:8px}
.photo-upload .photo-icon{font-size:24px;color:var(--grey3);margin-bottom:8px}

/* ── ALCOHOL SECTION ── */
.alcohol-item{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border:1px solid var(--border);background:var(--ivory2);margin-bottom:4px}
.alcohol-name{font-family:'Helvetica Neue',Arial,sans-serif;font-size:12px}
.alcohol-kcal{font-family:'Georgia',serif;font-size:14px;font-style:italic;color:var(--orange)}
.alcohol-freq{display:flex;gap:6px;align-items:center}

/* ── SPORT MODULE ── */
.exercise-card{background:var(--ivory2);border:1px solid var(--border);padding:16px;margin-bottom:16px;overflow:hidden}
.exercise-card:hover{border-color:var(--black2)}
.exercise-name{font-family:'Cormorant Garamond',Georgia,serif;font-size:16px;margin-bottom:4px}
.exercise-muscle{font-family:'Montserrat','Helvetica Neue',sans-serif;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--grey)}
.exercise-detail{font-family:'Helvetica Neue',Arial,sans-serif;font-size:11px;color:var(--grey);margin-top:6px}
.exercise-video{display:inline-flex;align-items:center;gap:6px;font-family:'Helvetica Neue',Arial,sans-serif;font-size:10px;color:var(--blue);margin-top:8px;text-decoration:none;border:1px solid var(--blue);padding:4px 10px;transition:all .2s}
.exercise-video:hover{background:var(--bluebg)}
.exercise-sets{font-family:'Helvetica Neue',Arial,sans-serif;font-size:11px;color:var(--black);margin-top:6px}
.body-silhouette{text-align:center;padding:20px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.muscle-tag{display:inline-block;padding:4px 10px;margin:3px;font-family:'Helvetica Neue',Arial,sans-serif;font-size:10px;border:1px solid var(--border);cursor:pointer;transition:all .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.muscle-tag.strong{background:var(--greenbg);border-color:var(--green);color:var(--green)}
.muscle-tag.weak{background:var(--redbg);border-color:var(--red);color:var(--red)}

/* ── STEP / PAGE TITLES ── */
.step-title{font-family:'Cormorant Garamond',Georgia,serif;font-size:22px;font-weight:normal;line-height:1.2;letter-spacing:0.3px;margin-bottom:20px;margin-top:32px}
.page-title{font-family:'Cormorant Garamond',Georgia,serif;font-size:28px;font-weight:normal;line-height:1.2;letter-spacing:-0.3px;margin-bottom:20px;margin-top:32px}

/* ── TAGS ── */
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}

/* ── VALIDATION ── */
.field-error{font-family:'Helvetica Neue',Arial,sans-serif;font-size:9px;color:var(--red);margin-top:4px}
.field.has-error input{border-color:var(--red)}
.required-dot{color:var(--red);font-size:8px;margin-left:2px}

/* ── RESPONSIVE ── */
@media(max-width:560px){
  h1{font-size:32px}
  .result-title{font-size:36px}
  .card-grid-3,.card-grid-4{grid-template-columns:1fr 1fr}
  .check-grid{grid-template-columns:1fr}
  .stats-row{grid-template-columns:1fr 1fr}
  .macro-pills{grid-template-columns:1fr 1fr}
  .rings-row{gap:20px}
  .photo-grid{grid-template-columns:1fr}
  .auth-container{padding:40px 16px}
  .main-nav-tab{font-size:8px;letter-spacing:3px;padding:12px 8px}
  .exercise-card{padding:12px}
}
@media(max-width:380px){
  .app{padding:0 20px 60px}
  .card-grid-2{grid-template-columns:1fr 1fr}
  .alcohol-item{flex-direction:column;align-items:flex-start;gap:6px}
  .user-bar{flex-direction:column;align-items:flex-start;gap:6px}
}
</style>
</head>
