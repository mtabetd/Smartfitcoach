<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartFitCoach — Console Admin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Helvetica Neue',Arial,sans-serif;background:#FAF9F6;color:#0A0A09;padding:24px;max-width:960px;margin:0 auto}
h1{font-family:Georgia,serif;font-size:24px;font-weight:normal;margin-bottom:4px}
.sub{font-size:11px;color:#6B6B65;letter-spacing:3px;text-transform:uppercase;margin-bottom:24px}
.gate{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:12px}
.gate input{padding:12px 16px;border:1px solid #D8D8D0;border-radius:2px;font-size:14px;width:280px}
.gate button{padding:12px 24px;background:#0A0A09;color:#FAF9F6;border:none;border-radius:2px;font-size:11px;letter-spacing:3px;text-transform:uppercase;cursor:pointer}
.gate .sign-out{background:transparent;color:#6B6B65;border:1px solid #D8D8D0;font-size:10px;padding:6px 12px;margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:28px}
.stat-card{border:1px solid #D8D8D0;border-radius:2px;padding:16px;text-align:center;background:#F4F4F0}
.stat-val{font-family:Georgia,serif;font-size:24px;margin-bottom:4px}
.stat-label{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:#6B6B65}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#0A0A09;color:#FAF9F6;padding:10px 12px;text-align:left;font-weight:400;font-size:10px;letter-spacing:2px;text-transform:uppercase}
td{padding:10px 12px;border-bottom:1px solid #D8D8D0}
tr:nth-child(even){background:#F4F4F0}
.badge{display:inline-block;padding:3px 8px;border-radius:2px;font-size:10px;letter-spacing:1px;text-transform:uppercase;font-weight:600}
.badge-trial{background:rgba(106,74,26,0.1);color:#6A4A1A}
.badge-active{background:rgba(26,74,26,0.1);color:#1A4A1A}
.badge-expired{background:rgba(90,16,16,0.1);color:#5A1010}
.badge-unlimited{background:rgba(26,58,106,0.1);color:#1A3A6A}
select,button{font-family:'Helvetica Neue',Arial,sans-serif}
.btn-sm{padding:6px 12px;border:1px solid #D8D8D0;background:transparent;border-radius:2px;font-size:10px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all 0.2s}
.btn-sm:hover{background:#0A0A09;color:#FAF9F6;border-color:#0A0A09}
.btn-save{padding:6px 12px;border:none;background:#1A4A1A;color:#FAF9F6;border-radius:2px;font-size:10px;letter-spacing:1px;text-transform:uppercase;cursor:pointer}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(10,10,9,0.5);display:none;align-items:center;justify-content:center;z-index:100}
.modal-overlay.open{display:flex}
.modal-box{background:#FAF9F6;padding:24px;border-radius:2px;max-width:400px;width:90%}
.modal-title{font-family:Georgia,serif;font-size:18px;margin-bottom:16px}
.field{margin-bottom:12px}
.field label{display:block;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#6B6B65;margin-bottom:6px}
.field select,.field input{width:100%;padding:10px 12px;border:1px solid #D8D8D0;border-radius:2px;font-size:14px;background:#FAF9F6}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0A0A09;color:#FAF9F6;padding:12px 20px;border-radius:2px;font-size:12px;display:none;z-index:200}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.top-bar .who{font-size:10px;color:#6B6B65;letter-spacing:2px;text-transform:uppercase}
#app{display:none}
</style>
</head>
<body>

<!-- GATE: Supabase login (admin-only, verified server-side via ADMIN_EMAILS) -->
<div class="gate" id="admin-gate">
  <div style="font-family:Georgia,serif;font-size:20px">Console Admin</div>
  <div style="font-size:11px;color:#6B6B65">SmartFitCoach</div>
  <input type="email" id="admin-email" placeholder="Email admin" autocomplete="email">
  <input type="password" id="admin-pw" placeholder="Mot de passe" autocomplete="current-password">
  <button onclick="tryLogin()">Connexion</button>
  <div id="gate-error" style="color:#5A1010;font-size:12px;max-width:320px;text-align:center"></div>
</div>

<!-- APP -->
<div id="app">
  <div class="top-bar">
    <div class="who" id="who"></div>
    <button class="btn-sm" onclick="signOut()">Déconnexion</button>
  </div>
  <h1>Console Admin</h1>
  <p class="sub">SmartFitCoach · Gestion des utilisateurs</p>

  <div class="stats" id="stats"></div>

  <div style="margin-bottom:16px;display:flex;justify-content:space-between;align-items:center">
    <div style="font-size:11px;color:#6B6B65" id="user-count"></div>
    <button class="btn-sm" onclick="loadUsers()">↻ Rafraîchir</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Utilisateur</th>
        <th>Email</th>
        <th>Inscription</th>
        <th>Statut</th>
        <th>Échéance</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="users-body"></tbody>
  </table>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal-box">
    <div class="modal-title" id="modal-title">Gérer l'abonnement</div>
    <div class="field">
      <label>Formule</label>
      <select id="modal-plan">
        <option value="trial">Trial 7 jours</option>
        <option value="1m">1 mois</option>
        <option value="3m">3 mois</option>
        <option value="6m">6 mois</option>
        <option value="12m">12 mois</option>
        <option value="unlimited">Illimité</option>
      </select>
    </div>
    <div class="field">
      <label>Date d'échéance</label>
      <input type="date" id="modal-date">
    </div>
    <div style="display:flex;gap:8px;margin-top:16px">
      <button class="btn-save" onclick="saveSubscription()">Enregistrer</button>
      <button class="btn-sm" onclick="closeModal()">Annuler</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Reuse the main app's Supabase client to avoid duplicating URL/anon key literals. -->
<script src="./supabase.min.js"></script>
<script src="./supabase-client.js"></script>
<script>
// ── STATE ──
// No client-side SHA256 gate. Authentication goes through Supabase login,
// and every privileged operation is a fetch() to a Netlify function that
// verifies the caller's JWT + checks ADMIN_EMAILS server-side.
var _client = null;
var _accessToken = null;
var _currentEmail = null;
var _editingUserId = null;

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(function() { t.style.display = 'none'; }, 3000);
}

function setGateError(msg) {
  document.getElementById('gate-error').textContent = msg || '';
}

function getClient() {
  if (_client) return _client;
  try {
    if (typeof window.getSupabaseClient === 'function') {
      _client = window.getSupabaseClient();
    }
  } catch(e) {}
  return _client;
}

async function tryLogin() {
  setGateError('');
  var email = (document.getElementById('admin-email').value || '').trim();
  var pw = document.getElementById('admin-pw').value || '';
  if (!email || !pw) { setGateError('Email et mot de passe requis'); return; }

  var c = getClient();
  if (!c) { setGateError('Client Supabase indisponible — rechargez la page'); return; }

  try {
    var res = await c.auth.signInWithPassword({ email: email, password: pw });
    if (res.error || !res.data || !res.data.session) {
      setGateError('Email ou mot de passe invalide');
      return;
    }
    _accessToken = res.data.session.access_token;
    _currentEmail = (res.data.user && res.data.user.email) || email;
    await openApp();
  } catch (e) {
    setGateError('Erreur de connexion : ' + (e.message || 'inconnue'));
  }
}

async function openApp() {
  // Probe the admin endpoint once to confirm this email is actually in
  // ADMIN_EMAILS. Avoids showing the full UI to a regular user who would
  // then hit 403s on every action.
  var r;
  try {
    r = await fetch('/.netlify/functions/admin-list-users', {
      headers: { 'Authorization': 'Bearer ' + _accessToken }
    });
  } catch (e) {
    setGateError('Serveur injoignable. Réessayez dans un instant.');
    return;
  }

  if (r.status === 403) {
    setGateError('Ce compte (' + _currentEmail + ') n\'est pas déclaré admin. Ajoutez-le à ADMIN_EMAILS dans Netlify.');
    await signOut(true);
    return;
  }
  if (r.status === 500) {
    var body = null;
    try { body = await r.json(); } catch(e) {}
    setGateError('Configuration serveur : ' + ((body && body.error) || 'erreur 500'));
    return;
  }
  if (!r.ok) {
    setGateError('Échec de chargement (HTTP ' + r.status + ')');
    return;
  }

  document.getElementById('admin-gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('who').textContent = _currentEmail || '';

  var json = await r.json();
  renderUsers(json.users || []);
}

async function signOut(silent) {
  var c = getClient();
  if (c) {
    try { await c.auth.signOut(); } catch(e) {}
  }
  _accessToken = null;
  _currentEmail = null;
  if (!silent) {
    document.getElementById('app').style.display = 'none';
    document.getElementById('admin-gate').style.display = 'flex';
    document.getElementById('admin-pw').value = '';
  }
}

document.addEventListener('DOMContentLoaded', function() {
  var pw = document.getElementById('admin-pw');
  if (pw) pw.addEventListener('keydown', function(e) { if (e.key === 'Enter') tryLogin(); });

  // Auto-login if session already present (e.g. refresh)
  var c = getClient();
  if (c) {
    c.auth.getSession().then(function(r) {
      if (r && r.data && r.data.session) {
        _accessToken = r.data.session.access_token;
        _currentEmail = (r.data.session.user && r.data.session.user.email) || null;
        openApp();
      }
    }).catch(function(){});
  }
});

// ── LOAD USERS ──
async function loadUsers() {
  if (!_accessToken) return;
  try {
    var r = await fetch('/.netlify/functions/admin-list-users', {
      headers: { 'Authorization': 'Bearer ' + _accessToken }
    });
    if (r.status === 401) { showToast('Session expirée, reconnectez-vous'); return signOut(); }
    if (!r.ok) { showToast('Échec du chargement (HTTP ' + r.status + ')'); return; }
    var json = await r.json();
    renderUsers(json.users || []);
  } catch (e) {
    showToast('Erreur: ' + (e.message || 'inconnue'));
  }
}

function renderUsers(users) {
  var tbody = document.getElementById('users-body');
  tbody.innerHTML = '';

  var now = new Date();
  var statsTrials = 0, statsActive = 0, statsExpired = 0, statsUnlimited = 0;

  users.forEach(function(user) {
    var profile = user.data || {};
    // Prefer the server-authoritative columns; fall back to the legacy
    // JSONB for pre-migration rows until every profile is backfilled.
    var subEnd  = user.subscription_end  || profile.subscriptionEnd  || null;
    var subPlan = user.subscription_plan || profile.subscriptionPlan || null;
    var firstLogin = profile.firstLoginDate || null;

    // Build the badge as a real DOM element — subPlan originates from
    // user-writable JSONB on legacy rows, so string-concat + innerHTML
    // would enable stored XSS against the admin. Use textContent.
    var status, badgeEl = document.createElement('span');
    badgeEl.className = 'badge';
    if (subPlan === 'unlimited') {
      status = 'unlimited';
      badgeEl.classList.add('badge-unlimited');
      badgeEl.textContent = 'Illimité';
      statsUnlimited++;
    } else if (subEnd && new Date(subEnd) > now) {
      status = 'active';
      badgeEl.classList.add('badge-active');
      badgeEl.textContent = 'Actif · ' + (subPlan || '');
      statsActive++;
    } else if (firstLogin) {
      var trialEnd = new Date(firstLogin);
      trialEnd.setDate(trialEnd.getDate() + 7);
      if (trialEnd > now) {
        var daysLeft = Math.ceil((trialEnd - now) / (1000 * 60 * 60 * 24));
        status = 'trial';
        badgeEl.classList.add('badge-trial');
        badgeEl.textContent = 'Trial · ' + daysLeft + 'j restants';
        statsTrials++;
      } else {
        status = 'expired';
        badgeEl.classList.add('badge-expired');
        badgeEl.textContent = 'Expiré';
        statsExpired++;
      }
    } else {
      status = 'trial';
      badgeEl.classList.add('badge-trial');
      badgeEl.textContent = 'Nouveau';
      statsTrials++;
    }

    var tr = document.createElement('tr');
    function _td(text) { var td = document.createElement('td'); td.textContent = text || '—'; return td; }
    tr.appendChild(_td(profile.prenom || user.name));
    tr.appendChild(_td(user.email));
    tr.appendChild(_td(firstLogin));
    var badgeTd = document.createElement('td'); badgeTd.appendChild(badgeEl); tr.appendChild(badgeTd);
    tr.appendChild(_td(subPlan === 'unlimited' ? '∞' : subEnd));
    var actionTd = document.createElement('td');
    var actionBtn = document.createElement('button');
    actionBtn.className = 'btn-sm';
    actionBtn.textContent = 'Gérer';
    actionBtn.onclick = (function(uid, uname, uplan, uend) { return function() { openModal(uid, uname, uplan, uend); }; })(user.id, profile.prenom || user.name || '', subPlan || '', subEnd || '');
    actionTd.appendChild(actionBtn);
    tr.appendChild(actionTd);
    tbody.appendChild(tr);
  });

  document.getElementById('user-count').textContent = users.length + ' utilisateur' + (users.length > 1 ? 's' : '');

  // Stats block: all values are trusted integers, safe to inline.
  document.getElementById('stats').innerHTML =
    '<div class="stat-card"><div class="stat-val">' + users.length + '</div><div class="stat-label">Total</div></div>' +
    '<div class="stat-card"><div class="stat-val">' + statsTrials + '</div><div class="stat-label">Trials</div></div>' +
    '<div class="stat-card"><div class="stat-val">' + statsActive + '</div><div class="stat-label">Actifs</div></div>' +
    '<div class="stat-card"><div class="stat-val">' + statsUnlimited + '</div><div class="stat-label">Illimités</div></div>' +
    '<div class="stat-card"><div class="stat-val">' + statsExpired + '</div><div class="stat-label">Expirés</div></div>';
}

// ── MODAL ──
function openModal(userId, name, currentPlan, currentEnd) {
  _editingUserId = userId;
  document.getElementById('modal-title').textContent = 'Abonnement · ' + (name || userId);
  document.getElementById('modal-plan').value = currentPlan || 'trial';
  document.getElementById('modal-date').value = currentEnd || '';
  document.getElementById('modal').classList.add('open');

  document.getElementById('modal-plan').onchange = function() {
    var plan = this.value;
    var d = new Date();
    if (plan === '1m') d.setMonth(d.getMonth() + 1);
    else if (plan === '3m') d.setMonth(d.getMonth() + 3);
    else if (plan === '6m') d.setMonth(d.getMonth() + 6);
    else if (plan === '12m') d.setFullYear(d.getFullYear() + 1);
    else if (plan === 'unlimited') { document.getElementById('modal-date').value = '2099-12-31'; return; }
    else if (plan === 'trial') { var t = new Date(); t.setDate(t.getDate() + 7); document.getElementById('modal-date').value = t.toISOString().slice(0,10); return; }
    document.getElementById('modal-date').value = d.toISOString().slice(0, 10);
  };
  document.getElementById('modal-plan').onchange();
}

function closeModal() {
  _editingUserId = null;
  document.getElementById('modal').classList.remove('open');
}

async function saveSubscription() {
  if (!_editingUserId || !_accessToken) return;
  var plan = document.getElementById('modal-plan').value;
  var endDate = document.getElementById('modal-date').value;
  if (plan === 'unlimited') endDate = '2099-12-31';

  try {
    var r = await fetch('/.netlify/functions/admin-update-subscription', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + _accessToken
      },
      body: JSON.stringify({ userId: _editingUserId, plan: plan, end: endDate })
    });
    if (r.status === 401) { showToast('Session expirée'); return signOut(); }
    var json = null; try { json = await r.json(); } catch(e) {}
    if (!r.ok) {
      showToast('Erreur: ' + ((json && json.error) || ('HTTP ' + r.status)));
      return;
    }
    showToast('Abonnement mis à jour');
    closeModal();
    loadUsers();
  } catch (e) {
    showToast('Erreur: ' + (e.message || 'inconnue'));
  }
}
</script>

</body>
</html>
