[build]
  publish = "app"
  command = "node scripts/build-bundle.js && node scripts/bump-sw-version.js"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."body-analysis"]
  timeout = 26

[functions."ai-coach"]
  timeout = 26

[functions."plate-scan"]
  timeout = 26

[functions."generate-muscu-program"]
  timeout = 26

# ── Security Headers ────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://browser.sentry-cdn.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://world.openfoodfacts.org https://images.openfoodfacts.org; media-src 'self' blob:; connect-src 'self' https://world.openfoodfacts.org https://*.supabase.co wss://*.supabase.co https://*.ingest.sentry.io; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';"
    X-XSS-Protection = "1; mode=block"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# ── Service Worker + HTML : jamais mis en cache par le CDN ──────────────────
# Sans ces headers, le browser peut servir l'ancien sw.js pendant des heures
# même après un déploiement → l'utilisateur doit fermer l'app pour voir les MAJ.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# ── Functions: no-cache headers ─────────────────────────────────────────────
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"

# ── Static assets: long-lived caching (content-hashed or version-bumped) ─────
[[headers]]
  for = "/app/bundle.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/app/premium-ui.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/app/jspdf.umd.min.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/app/chart.umd.min.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/app/icon-192.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/app/icon-512.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── APK Android — MIME type correct pour téléchargement direct ───────────────
[[headers]]
  for = "/*.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment"
    Cache-Control = "public, max-age=86400"

# ── SPA Fallback ─────────────────────────────────────────────────────────────
[[redirects]]
  from = "/*.apk"
  to = "/:splat.apk"
  status = 200
  force = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
